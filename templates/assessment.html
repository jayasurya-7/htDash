{% extends "base.html" %}

{% block title %}Assessment Uploads — htDash{% endblock %}

{% block content %}
<div class="p-6">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-slate-800">Assessment Uploads</h1>
    <p class="text-sm text-slate-500 mt-1">Upload scanned assessment PDFs after the clinical team completes each assessment.</p>
  </div>

  <!-- Loading state -->
  <div id="loading-spinner" class="text-center py-8">
    <div class="inline-flex items-center gap-2 text-slate-600">
      <i class="fas fa-spinner fa-spin"></i> Loading patients…
    </div>
  </div>

  <!-- Patients list (hidden initially) -->
  <div id="patients-container" class="hidden space-y-4"></div>

  <!-- Empty state (shown if no patients) -->
  <div id="empty-state" class="hidden text-center py-8 text-slate-500">
    <p>No patients found for your site.</p>
  </div>

  <!-- Error message -->
  <div id="error-message" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600"></div>
</div>

<!-- Hidden file input for PDF uploads -->
<input type="file" id="pdf-file-input" accept=".pdf" style="display:none;">

<!-- Modal for upload progress -->
<div id="upload-progress-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
    <h3 class="text-lg font-bold text-slate-800 mb-4">Uploading PDF…</h3>
    <div class="w-full bg-slate-200 rounded-full h-2 mb-2">
      <div id="upload-progress-bar" class="bg-blue-500 h-2 rounded-full" style="width: 0%"></div>
    </div>
    <p id="upload-progress-text" class="text-sm text-slate-600">0%</p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app/assessment.js') }}"></script>
{% endblock %}
